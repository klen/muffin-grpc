[project]
name = "muffin-grpc"
version = "0.10.0"
description = "GRPC support for Muffin framework."
authors = [{ name = "Kirill Klenov", email = "horneds@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.rst"
license = "MIT"
keywords = ["grpc", "muffin", "asyncio", "asgi", "web"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: AsyncIO",
]
dependencies = [
  "attrs",
  "grpcio>=1",
  "grpcio-tools>=1",
  "muffin",
  "proto-schema-parser",
]

[project.urls]
Homepage = "https://github.com/klen/muffin-grpc"
Repository = "https://github.com/klen/muffin-grpc"

[dependency-groups]
dev = [
  "pytest",
  "pytest-aio[curio, trio]",
  "ruff",
  "pyrefly",
  "pre-commit",
  "tox",
]
example = ["uvicorn", "muffin-jinja2"]

[tool.uv]
default-groups = ["dev", "example"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "muffin_grpc"
module-root = ""

[tool.pytest.ini_options]
addopts = "-xsv tests"
log_cli = true

[tool.pyrefly]
project-includes = ["muffin_grpc"]
project-excludes = ["tests", "example", "pyproject.toml"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py311,py312,py313,py314,py315

[testenv]
allowlist_externals = uv,pytest
setenv =
  UV_PROJECT_ENVIRONMENT = {envdir}
commands =
  uv sync --locked --all-extras
	pytest tests
"""

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "example", "tests/proto/compiled"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A003",
  "ANN",
  "ARG",
  "COM",
  "CPY001",
  "D",
  "DJ",
  "EM",
  "FA100",
  "FIX",
  "N",
  "PLC0415",
  "PLR0912",
  "PLR2004",
  "RET",
  "RSE",
  "RUF012",
  "S101",
  "SLF",
  "TD",
  "TRY003",
  "UP",
]

[tool.bumpversion]
current_version = "0.10.0"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
